            document.getElementById("trackArtist").innerText = track.artist;
            
            // Carrega o player embutido oficial com a capa gerada automaticamente pelo streaming
            document.getElementById("streamingIframe").src = `https://open.spotify.com/embed/track/${track.id}?utm_source=generator&theme=0`;
            
            const totalText = currentLang === 'en' ? `Track ${currentIndex + 1} of ${tracks.length}` : (currentLang === 'es' ? `Pista ${currentIndex + 1} de ${tracks.length}` : `Faixa ${currentIndex + 1} de ${tracks.length}`);
            document.getElementById("trackCounter").innerText = totalText;
        }

        function nextTrack() {
            currentIndex = (currentIndex + 1) % tracks.length;
            updatePlayer();
        }

        function prevTrack() {
            currentIndex = (currentIndex - 1 + tracks.length) % tracks.length;
            updatePlayer();
        }

        function performSearch() {
            const query = document.getElementById("searchInput").value.toLowerCase().trim();
            if (!query) return;

            const foundIndex = tracks.findIndex(t => t.title.toLowerCase().includes(query) || t.artist.toLowerCase().includes(query));
            
            if (foundIndex !== -1) {
                currentIndex = foundIndex;
                updatePlayer();
            } else {
                const msg = currentLang === 'en' ? "Song not found in catalog!" : (currentLang === 'es' ? "¡Canción no encontrada!" : "Música não encontrada no catálogo!");
                alert(msg);
            }
        }

        function handleSearch(event) {
            if (event.key === 'Enter') {
                performSearch();
            }
        }

        window.onload = () => { setLanguage('pt'); };
    </script>

</body>
</html>
